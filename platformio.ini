; PlatformIO Project Configuration File
; SuperFireflies — ATtiny412 Port
;
; https://docs.platformio.org/page/projectconf.html

[env:ATtiny412]
platform = atmelmegaavr
board = ATtiny412

; 20MHz internal oscillator
board_build.f_cpu = 20000000L

; No Arduino framework — bare-metal AVR-libc
build_flags =
    -Os
    -std=gnu11
    -DF_CPU=20000000UL

upload_protocol = snap_updi
upload_flags =
    -Pusb

; Safe fuses for ATtiny412 @ 20MHz
; WDTCFG:   0x0B - WDT enabled, normal mode, 8s timeout (crash guard)
; BODCFG:   0x00 - BOD disabled
; OSCCFG:   0x02 - 20MHz oscillator selected
; TCD0CFG:  0x00 - Default
; SYSCFG0:  0xC9 - Reset pin as RESET (not GPIO!), CRC disabled
; APPEND:   0x00 - No append section
; BOOTEND:  0x00 - No bootloader section
board_fuses.WDTCFG = 0x0B
board_fuses.BODCFG = 0x00
board_fuses.OSCCFG = 0x02
board_fuses.TCD0CFG = 0x00
board_fuses.SYSCFG0 = 0xC9
board_fuses.APPEND = 0x00
board_fuses.BOOTEND = 0x00
